app.jwt.secret=${JWT_SECRET:SuperSecretJWTKeyForNeuroDetect2026LongEnough123!}
app.jwt.expiration=86400000
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}