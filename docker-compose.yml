services:
  postgres:
    image: postgres:15-alpine
    container_name: neurodetect-postgres
    environment:
      POSTGRES_DB: neurodetect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: neurodetect-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/neurodetect
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-devpassword123}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretJWTKeyForNeuroDetect2026LongEnough123!}
      AI_SERVICE_URL: http://ai-service:8000
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  ai-service:
    build: ./ai-service
    container_name: neurodetect-ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/model:/app/model:ro
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: neurodetect-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - app-net
    depends_on:
      - backend
    stdin_open: true
    tty: true

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data: